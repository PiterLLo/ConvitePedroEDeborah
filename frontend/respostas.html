<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Respostas RSVP</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f9f9f9;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .navigation {
            text-align: center;
            margin-bottom: 20px;
        }
        .navigation a {
            margin: 0 10px;
            text-decoration: none;
            color: #333;
            padding: 5px 10px;
            border: 1px solid #333;
            border-radius: 5px;
            transition: all 0.3s ease;
        }
        .navigation a:hover {
            background: #333;
            color: white;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }
        th {
            background-color: #8B7355;
            color: white;
            font-weight: bold;
        }
        tr:hover {
            background-color: #f5f5f5;
        }
        .center {
            text-align: center;
        }
        .sim {
            color: green;
            font-weight: bold;
        }
        .nao {
            color: red;
            font-weight: bold;
        }
        .totais {
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            padding: 15px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 0 5px rgba(0,0,0,0.1);
            border-left: 4px solid #D4AF37;
        }
        .loading {
            text-align: center;
            color: #666;
            font-style: italic;
        }
        .error {
            text-align: center;
            color: red;
            font-weight: bold;
        }
        .mensagem-col {
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .mensagem-col:hover {
            white-space: normal;
            overflow: visible;
            background: #f9f9f9;
            position: relative;
            z-index: 1;
        }
        @media (max-width: 768px) {
            table {
                font-size: 14px;
            }
            th, td {
                padding: 8px;
            }
            .navigation a {
                display: block;
                margin: 5px 0;
            }
        }
    </style>
</head>
<body>
    <div class="navigation">
        <a href="/">🏠 Home</a>
        <a href="/presente">🎁 Lista de Presentes</a>
        <a href="/respostas">📋 Ver Confirmações</a>
    </div>

    <h1>Confirmações de Presença</h1>
    <div class="totais" id="totais">Carregando totais...</div>
    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Nome</th>
                <th>Contato</th>
                <th>Presença</th>
                <th>Mensagem</th>
                <th>Data</th>
            </tr>
        </thead>
        <tbody id="rsvp-list">
            <tr>
                <td colspan="6" class="center loading">Carregando confirmações...</td>
            </tr>
        </tbody>
    </table>

    <script>
        async function carregarRSVP() {
            const tbody = document.getElementById('rsvp-list');
            const totaisDiv = document.getElementById('totais');
            
            try {
                console.log('📥 Buscando dados da API...');
                const response = await fetch('/api/rsvp');
                
                if (!response.ok) {
                    throw new Error(`Erro HTTP: ${response.status}`);
                }
                
                const dados = await response.json();
                console.log(`✅ Dados recebidos: ${dados.length} registros`);

                tbody.innerHTML = '';

                if (!dados.length) {
                    tbody.innerHTML = '<tr><td colspan="6" class="center loading">Nenhuma confirmação ainda</td></tr>';
                    totaisDiv.textContent = "Nenhuma confirmação recebida ainda.";
                    return;
                }

                let countSim = 0;
                let countNao = 0;

                dados.forEach((rsvp, index) => {
                    if (rsvp.attending === "yes") countSim++;
                    if (rsvp.attending === "no") countNao++;

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${index + 1}</td>
                        <td>${rsvp.name || 'N/A'}</td>
                        <td>${rsvp.contact || 'N/A'}</td>
                        <td class="${rsvp.attending === 'yes' ? 'sim' : 'nao'}">
                            ${rsvp.attending === 'yes' ? '✔ Sim' : '✖ Não'}
                        </td>
                        <td class="mensagem-col" title="${rsvp.message || ''}">
                            ${rsvp.message || '-'}
                        </td>
                        <td>${new Date(rsvp.created_at).toLocaleDateString('pt-BR')} ${new Date(rsvp.created_at).toLocaleTimeString('pt-BR')}</td>
                    `;
                    tbody.appendChild(tr);
                });

                totaisDiv.innerHTML = `
                    <span style="color: green;">✅ Confirmados: ${countSim}</span> | 
                    <span style="color: red;">❌ Não irão: ${countNao}</span> | 
                    <span style="color: #333;">📋 Total de respostas: ${dados.length}</span>
                `;

            } catch (err) {
                console.error('❌ Erro ao carregar RSVP:', err);
                tbody.innerHTML = '<tr><td colspan="6" class="center error">Erro ao carregar dados. Tente recarregar a página.</td></tr>';
                totaisDiv.innerHTML = '<span style="color: red;">❌ Erro ao carregar totais</span>';
            }
        }

        // Carrega os dados ao abrir a página
        document.addEventListener('DOMContentLoaded', function() {
            carregarRSVP();
            
            // Atualiza a cada 30 segundos (aumentei o tempo)
            setInterval(carregarRSVP, 30000);
        });

        // Também recarrega quando a página ganha foco
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) {
                carregarRSVP();
            }
        });
    </script>
</body>
</html>
